project_id = "jn-fin-services"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12
[auth.email]
# Keep email/password login enabled; global auth.enable_signup=false blocks registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
[auth.rate_limit]
sign_in_sign_ups = 30
password_resets = 5
